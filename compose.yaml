name: requirements-workbench
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: requirements
      POSTGRES_USER: requirements
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - requirement_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requirements -d requirements"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  requirement_pg:
